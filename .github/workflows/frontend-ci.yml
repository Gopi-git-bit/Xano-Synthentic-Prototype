name: Frontend mock contracts and validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      XANO_AUTH_RELEASE: blocked
      XANO_BOOKING_READS_RELEASE: blocked
      ZOHO_READ_RELEASE: blocked
      XANO_AUTH_BASE_URL: https://xano.invalid/api:auth
      XANO_LOGISTICS_BASE_URL: https://xano.invalid/api:zippy-v1
      CRM_READ_GRANTS_JSON: '{}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:server
      - run: node scripts/scan-browser.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
