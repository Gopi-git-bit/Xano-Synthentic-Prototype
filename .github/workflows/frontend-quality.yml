# Checks only. Never deploys Vercel, publishes Xano, or enables live APIs.
name: Zippy frontend quality checks

on:
  pull_request:
    branches:
      - feat/frontend-tailwind-polish
  push:
    branches:
      - feat/frontend-tailwind-polish

permissions:
  contents: read

concurrency:
  group: zippy-frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: TypeScript, lint, build, server and Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      XANO_AUTH_RELEASE: blocked
      XANO_BOOKING_READS_RELEASE: blocked
      ZOHO_READ_RELEASE: blocked

    steps:
      - name: Checkout review commit
        uses: actions/checkout@v4

      - name: Set up Node 24 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint validation
        run: npm run lint

      - name: Production bundle build
        run: npm run build

      - name: Scan browser bundle for forbidden private key identifiers
        run: node scripts/scan-browser.mjs

      - name: Mocked server and gateway tests
        run: npm run test:server

      - name: Install Microsoft Edge for existing Playwright configuration
        run: npx playwright install --with-deps msedge

      - name: Run existing Playwright browser tests
        run: npm test

      - name: Upload browser diagnostics on failure (synthetic fixtures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
